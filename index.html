    <script>
      // Aggressively unregister any stale PWA Service Workers to ensure the Android WebView always loads fresh Vercel deployments
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
          }
        });
      }
      // Clear out Cache API so old chunks don't conflict
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (let name of names) {
            caches.delete(name);
          }
        });
      }
    </script>
