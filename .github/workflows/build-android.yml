name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Olive Pizza APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js 22 (required by Capacitor 8+)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 3. Install dependencies
      - name: Install Node dependencies
        run: npm ci

      # 4. Setup Java 21 (required by Android Gradle Plugin for Capacitor 8+)
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 5. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 6. Initialize dummy webDir and sync Capacitor
      #    We must create the webDir before syncing so Capacitor doesn't crash.
      #    Syncing must happen after Java/Android SDK setup so Capacitor can process Gradle files.
      - name: Sync Capacitor
        run: |
          mkdir -p dist/client
          echo "Placeholder" > dist/client/index.html
          npx --yes cap sync android

      # 7. Cache Gradle files for faster builds
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 8. Grant execute permission to Gradle wrapper
      - name: Grant Gradle execute permissions
        run: chmod +x android/gradlew

      # 9. Automatic Versioning
      - name: Inject Version into Gradle
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/g" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/g" android/app/build.gradle

      # 10. Prepare Signing Keystore
      #     Priority: KEYSTORE_BASE64 secret (if set) → committed release.keystore
      #     The signing passwords are hardcoded in build.gradle with fallback "olivepizza".
      - name: Prepare Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "✅ Keystore decoded from KEYSTORE_BASE64 secret."
          elif [ -f "android/app/release.keystore" ]; then
            echo "✅ Using committed release.keystore from repository."
          else
            echo "❌ ERROR: No keystore available. Commit release.keystore or set KEYSTORE_BASE64 secret."
            exit 1
          fi
          # Verify the keystore is readable and alias exists
          keytool -list -keystore android/app/release.keystore \
            -storepass olivepizza -alias olivepizza -noprompt \
            && echo "✅ Keystore verified — alias 'olivepizza' found." \
            || { echo "❌ Keystore verification failed."; exit 1; }

      # 11. Build Signed Release APK
      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android

      # 12. Verify the APK is properly signed (not unsigned)
      - name: Verify APK Signature
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "❌ app-release.apk not found. Checking directory:"
            ls android/app/build/outputs/apk/release/ || true
            exit 1
          fi
          SIZE=$(du -sh "$APK" | cut -f1)
          echo "✅ APK found ($SIZE)"
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner verify --verbose "$APK" \
            && echo "✅ APK is properly signed." \
            || { echo "❌ APK signature verification FAILED — APK is unsigned or corrupted."; exit 1; }

      # 13. Rename APK for easy identification
      - name: Rename APK
        run: |
          mkdir -p artifact
          cp android/app/build/outputs/apk/release/app-release.apk artifact/OlivePizza-v1.0.apk

      # 14. Upload APK as GitHub Actions artifact (available 90 days)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OlivePizza-Android-APK
          path: artifact/OlivePizza-v1.0.apk
          retention-days: 90

      # 15. Publish as a GitHub Release (always replaces android-latest tag)
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "Olive Pizza Android App — Latest Build"
          body: |
            Latest automatic build of the Olive Pizza Android APK.
            Version Code: ${{ github.run_number }}

            🍕 **Olive Pizza Android App** — automatically built from latest code.

            This is a native Android wrapper that streams the live production site:
            👉 https://olive-pizza.vercel.app

            **How to install:**
            1. Download `OlivePizza-v1.0.apk` below.
            2. On your Android device: **Settings → Security → Install unknown apps** → allow your file manager.
            3. Open the downloaded APK and tap **Install**.
          files: artifact/OlivePizza-v1.0.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
