name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Olive Pizza APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js 22 (required by Capacitor 8+)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 3. Install dependencies
      - name: Install Node dependencies
        run: npm ci

      # 4. Setup Java 21 (required by Android Gradle Plugin for Capacitor 8+)
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 5. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 6. Inject google-services.json from GitHub Secrets
      # DOCUMENTATION: 
      # The 'google-services.json' file is strictly required by the 'com.google.gms.google-services' Gradle plugin 
      # and the '@capacitor-firebase/authentication' Native plugin. Without it, the Android build will fail.
      # It is injected into the 'android/app/google-services.json' path, which is the exact location the Google Services 
      # plugin expects it to be during the Gradle build phase.
      # To prevent exposing this sensitive file in the public repository, it is stored as a GitHub Repository Secret.
      - name: Inject google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error title=Missing Required Secret::The GOOGLE_SERVICES_JSON secret is missing or empty!"
            echo "::error::Firebase is REQUIRED for this build configuration due to Native Firebase Authentication."
            echo "::error::ACTION REQUIRED: Go to GitHub Settings -> Secrets and variables -> Actions."
            echo "::error::Create a New repository secret named 'GOOGLE_SERVICES_JSON'."
            echo "::error::Paste the exact contents of your google-services.json file and click 'Add secret'."
            exit 1
          fi
          
          echo "Secret found! Injecting google-services.json into android/app/ directory..."
          mkdir -p android/app
          
          # We use cat to safely write the JSON string to the file to avoid quote parsing issues
          cat << EOF > android/app/google-services.json
          $GOOGLE_SERVICES_JSON
          EOF

      # 7. Initialize dummy webDir and sync Capacitor
      #    We must create the webDir before syncing so Capacitor doesn't crash.
      #    Syncing must happen after Java/Android SDK setup so Capacitor can process Gradle files.
      - name: Sync Capacitor
        run: |
          mkdir -p dist/client
          echo "Placeholder" > dist/client/index.html
          npx --yes cap sync android

      # 7. Cache Gradle files for faster builds
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 8. Grant execute permission to Gradle wrapper
      - name: Grant Gradle execute permissions
        run: chmod +x android/gradlew

      # 9. Automatic Versioning
      - name: Inject Version into Gradle
        run: |
          # Use GitHub Run Number as the version code and a generated version name
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/g" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/g" android/app/build.gradle

      # 10. Decode Release Keystore
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "Keystore decoded successfully."
          else
            echo "::warning::KEYSTORE_BASE64 secret is missing. The APK will fail to sign properly if not configured."
          fi

      # 11. Build Release APK
      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        working-directory: android

      # 12. Rename APK for easy identification
      - name: Rename APK
        run: |
          mkdir -p artifact
          cp android/app/build/outputs/apk/release/app-release.apk artifact/OlivePizza-v1.0.apk

      # 13. Upload APK as GitHub Actions artifact (available 90 days)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OlivePizza-Android-APK
          path: artifact/OlivePizza-v1.0.apk
          retention-days: 90

      # 11. Publish as a GitHub Release so the Owner Dashboard download button always works
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "Olive Pizza Android App — Latest Build"
          body: |
            Latest automatic build of the Olive Pizza Android APK.
            Version Code: ${{ github.run_number }}

            🍕 **Olive Pizza Android App** — automatically built from latest code.

            This is a native Android wrapper that streams the live production site:
            👉 https://olive-pizza.vercel.app

            **How to install:**
            1. Download `OlivePizza-v1.0.apk` below.
            2. On your Android device: **Settings → Security → Install unknown apps** → allow your file manager.
            3. Open the downloaded APK and tap **Install**.
          files: artifact/OlivePizza-v1.0.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
