name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Olive Pizza APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install dependencies
      - name: Install Node dependencies
        run: npm ci

      # 4. Setup Java 17 (required for Android Gradle Plugin)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 5. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 6. Initialize dummy webDir and sync Capacitor
      #    We must create the webDir before syncing so Capacitor doesn't crash.
      #    Syncing must happen after Java/Android SDK setup so Capacitor can process Gradle files.
      - name: Sync Capacitor
        run: |
          mkdir -p dist/client
          echo "Placeholder" > dist/client/index.html
          npx --yes cap sync android

      # 7. Cache Gradle files for faster builds
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 8. Grant execute permission to Gradle wrapper
      - name: Grant Gradle execute permissions
        run: chmod +x android/gradlew

      # 9. Automatic Versioning
      - name: Inject Version into Gradle
        run: |
          # Use GitHub Run Number as the version code and a generated version name
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/g" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/g" android/app/build.gradle

      # 10. Build debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: android

      # 9. Rename APK for easy identification
      - name: Rename APK
        run: |
          mkdir -p artifact
          cp android/app/build/outputs/apk/debug/app-debug.apk artifact/OlivePizza-v1.0.apk

      # 10. Upload APK as GitHub Actions artifact (available 90 days)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OlivePizza-Android-APK
          path: artifact/OlivePizza-v1.0.apk
          retention-days: 90

      # 11. Publish as a GitHub Release so the Owner Dashboard download button always works
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "Olive Pizza Android App — Latest Build"
          body: |
            🍕 **Olive Pizza Android App** — automatically built from latest code.

            This is a native Android wrapper that streams the live production site:
            👉 https://olive-pizza.vercel.app

            **How to install:**
            1. Download `OlivePizza-v1.0.apk` below.
            2. On your Android device: **Settings → Security → Install unknown apps** → allow your file manager.
            3. Open the downloaded APK and tap **Install**.
          files: artifact/OlivePizza-v1.0.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
